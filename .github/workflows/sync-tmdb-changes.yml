name: Sync TMDB changes

on:
  schedule:
    # 09:15 UTC daily, after TMDB's own daily export settles.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of changes to pull"
        required: false
        default: "1"

concurrency:
  group: sync-tmdb-changes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sync:changes -- --days=${{ inputs.days || '1' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
